<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Braccio Robotico 3D - Super Visibile</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.159.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial,sans-serif}
    body{background:#020617;color:#e5e7eb;height:100vh;display:flex;flex-direction:column}
    #topbar{padding:8px 12px;border-bottom:1px solid rgba(148,163,184,0.4);background:#020617;display:flex;justify-content:space-between;align-items:center;font-size:13px}
    #main{flex:1;display:grid;grid-template-columns:3fr 1fr;min-height:0}
    #view{position:relative;background:#020617}
    canvas{width:100%;height:100%;display:block}
    #hud{position:absolute;left:12px;bottom:12px;padding:8px 10px;border-radius:999px;background:rgba(15,23,42,0.9);border:1px solid rgba(148,163,184,0.5);font-size:12px}
    #hud span{color:#a5b4fc}
    #panel{padding:10px;border-left:1px solid rgba(148,163,184,0.4);background:#020617;font-size:13px;display:flex;flex-direction:column;gap:10px}
    h2{font-size:13px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.08em}
    .sec{border-radius:10px;border:1px solid rgba(148,163,184,0.4);padding:8px;background:#030712}
    .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    button,select{font-size:12px;border-radius:8px;border:1px solid rgba(148,163,184,0.7);padding:6px 8px;background:#020617;color:#e5e7eb;cursor:pointer}
    button.primary{background:linear-gradient(90deg,#38bdf8,#6366f1);border:none;color:#020617;font-weight:600}
    button.danger{background:linear-gradient(90deg,#fb7185,#f97316);border:none;color:#020617;font-weight:600}
    small{font-size:11px;color:#9ca3af}
    @media(max-width:900px){#main{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="topbar">
    <div><strong>Braccio Robotico 3D</strong> – ruota, zooma, chiudi dita, smonta</div>
    <div>Trascina: ruota • Rotellina: zoom</div>
  </div>
  <div id="main">
    <div id="view">
      <canvas id="c"></canvas>
      <div id="hud">Stato: <span id="state">Assemblato</span></div>
    </div>
    <div id="panel">
      <div class="sec">
        <h2>Movimento mano</h2>
        <div class="row">
          <button id="openHand" class="primary">Apri mano</button>
          <button id="closeHand">Chiudi mano</button>
        </div>
        <small>Controllo globale di tutte le dita.</small>
      </div>
      <div class="sec">
        <h2>Dito singolo</h2>
        <label for="fingerSel">Seleziona dito:</label>
        <select id="fingerSel">
          <option value="0">Pollice</option>
          <option value="1">Indice</option>
          <option value="2">Medio</option>
          <option value="3">Anulare</option>
          <option value="4">Mignolo</option>
        </select>
        <div class="row">
          <button id="openFinger" class="primary">Apri dito</button>
          <button id="closeFinger">Chiudi dito</button>
        </div>
      </div>
      <div class="sec">
        <h2>Smonta protesi</h2>
        <div class="row">
          <button id="explode" class="danger">Smonta</button>
          <button id="assemble">Rimonta</button>
        </div>
        <small>Mostra i pezzi interni: gusci, schede elettroniche, cavi, strutture metalliche.</small>
      </div>
    </div>
  </div>

  <script>
    // === SCENA BASE ===
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);

    const camera = new THREE.PerspectiveCamera(40, 2, 0.1, 100);
    camera.position.set(10, 4, 10);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(2, 1.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 3;
    controls.maxDistance = 30;

    function resize() {
      const w = canvas.clientWidth || canvas.parentElement.clientWidth;
      const h = canvas.clientHeight || canvas.parentElement.clientHeight;
      if (canvas.width !== w || canvas.height !== h) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
    }
    window.addEventListener('resize', resize);

    // Luci
    const amb = new THREE.AmbientLight(0x9fbcd9, 0.4);
    scene.add(amb);
    const key = new THREE.DirectionalLight(0xffffff, 1.3);
    key.position.set(8, 10, 5);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x60a5fa, 0.8);
    rim.position.set(-8, 6, -4);
    scene.add(rim);

    // Pavimento
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(20, 64),
      new THREE.MeshStandardMaterial({color:0x020617, metalness:0.8, roughness:0.5})
    );
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -0.5;
    scene.add(floor);

    // === MATERIALI REALISTICI ===
    const matShell = new THREE.MeshPhysicalMaterial({
      color: 0xf3f4f6,
      metalness: 0.6,
      roughness: 0.12,
      clearcoat: 0.8,
      clearcoatRoughness: 0.04
    });
    const matMetal = new THREE.MeshStandardMaterial({
      color: 0xc0cad2,
      metalness: 1,
      roughness: 0.04
    });
    const matDark = new THREE.MeshStandardMaterial({
      color: 0x111827,
      metalness: 0.9,
      roughness: 0.25
    });
    const matPCB = new THREE.MeshStandardMaterial({
      color: 0x14532d,
      metalness: 0.3,
      roughness: 0.4,
      emissive: 0x16a34a,
      emissiveIntensity: 0.3
    });
    const matCable = new THREE.MeshStandardMaterial({
      color: 0x020617,
      metalness: 0.2,
      roughness: 0.7
    });

    // === GRUPPI BRACCIO (SCALA GRANDE) ===
    const armRoot = new THREE.Group();
    scene.add(armRoot);
    armRoot.position.set(0, 0.5, 0);
    armRoot.scale.set(2.2, 2.2, 2.2); // BRACCIO MOLTO GRANDDE

    // Spalla
    const shoulderShell = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.8, 0.6, 16, 32),
      matShell
    );
    shoulderShell.rotation.z = Math.PI/2;
    shoulderShell.position.set(-2.2, 0.4, 0);
    armRoot.add(shoulderShell);

    const shoulderCore = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.6, 0.2, 16, 32),
      matMetal
    );
    shoulderCore.rotation.z = Math.PI/2;
    shoulderCore.position.set(-1.7, 0.4, 0);
    armRoot.add(shoulderCore);

    // Braccio superiore (upper arm)
    const upperGroup = new THREE.Group();
    upperGroup.position.set(-0.9, 0.4, 0);
    armRoot.add(upperGroup);

    const upperShell = new THREE.Mesh(
      new THREE.CylinderGeometry(0.6, 0.8, 2.4, 32, 1, true),
      matShell
    );
    upperShell.rotation.z = Math.PI/2;
    upperShell.position.set(1.2, 0, 0);
    upperGroup.add(upperShell);

    const upperCore = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.3, 2.2, 32),
      matMetal
    );
    upperCore.rotation.z = Math.PI/2;
    upperCore.position.set(1.2, 0, 0);
    upperGroup.add(upperCore);

    // Gomito
    const elbow = new THREE.Mesh(
      new THREE.SphereGeometry(0.55, 32, 32),
      matDark
    );
    elbow.position.set(1.8, 0.4, 0);
    armRoot.add(elbow);

    // Avambraccio
    const foreGroup = new THREE.Group();
    foreGroup.position.set(1.8, 0.4, 0);
    armRoot.add(foreGroup);

    const foreShell = new THREE.Mesh(
      new THREE.CylinderGeometry(0.55, 0.7, 2.2, 32, 1, true),
      matShell
    );
    foreShell.rotation.z = Math.PI/2;
    foreShell.position.set(1.3, 0, 0);
    foreGroup.add(foreShell);

    const foreCore = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.28, 2.0, 32),
      matMetal
    );
    foreCore.rotation.z = Math.PI/2;
    foreCore.position.set(1.3, 0, 0);
    foreGroup.add(foreCore);

    // PCB laterale
    const pcb = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.7, 0.9),
      matPCB
    );
    pcb.position.set(0.8, 0.2, -0.4);
    pcb.rotation.y = 0.5;
    foreGroup.add(pcb);

    // Cavi
    const cable1 = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.06, 1.4, 16),
      matCable
    );
    cable1.rotation.z = Math.PI/2;
    cable1.position.set(0.7, -0.1, 0.45);
    foreGroup.add(cable1);

    const cable2 = cable1.clone();
    cable2.position.set(1.5, -0.1, -0.45);
    foreGroup.add(cable2);

    // Polso
    const wristGroup = new THREE.Group();
    wristGroup.position.set(3.2, 0.4, 0);
    armRoot.add(wristGroup);

    const wrist = new THREE.Mesh(
      new THREE.CylinderGeometry(0.45, 0.5, 0.6, 32),
      matDark
    );
    wrist.rotation.z = Math.PI/2;
    wristGroup.add(wrist);

    const wristRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.5, 0.08, 16, 64),
      matMetal
    );
    wristRing.rotation.x = Math.PI/2;
    wristGroup.add(wristRing);

    // Mano
    const handGroup = new THREE.Group();
    handGroup.position.set(3.6, 0.4, 0);
    armRoot.add(handGroup);

    const palm = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 0.35, 1.3),
      matShell
    );
    handGroup.add(palm);

    // Dita (5 dita, 3 falangi)
    const fingers = [];
    const fingerOffsetsZ = [-0.6, -0.3, 0, 0.3, 0.6];
    for (let i = 0; i < 5; i++) {
      const root = new THREE.Group();
      root.position.set(0.55, 0, fingerOffsetsZ[i]);
      handGroup.add(root);

      const seg1 = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.18, 0.18),
        matMetal
      );
      seg1.position.set(0.2, 0, 0);
      root.add(seg1);

      const mid = new THREE.Group();
      mid.position.set(0.4, 0, 0);
      root.add(mid);

      const seg2 = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.16, 0.16),
        matMetal
      );
      seg2.position.set(0.175, 0, 0);
      mid.add(seg2);

      const tip = new THREE.Group();
      tip.position.set(0.35, 0, 0);
      mid.add(tip);

      const seg3 = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.14, 0.14),
        matMetal
      );
      seg3.position.set(0.15, 0, 0);
      tip.add(seg3);

      fingers.push({root, mid, tip});
    }

    // Pollice inclinato un po'
    fingers[0].root.rotation.y = 0.4;
    fingers[0].root.position.z = -0.4;

    // === ANIMAZIONE DITA ===
    let animSpeed = 1;

    function setFingerPose(index, closed) {
      const f = fingers[index];
      if (!f) return;
      const base = closed ? -1.0 : 0;
      const mid = closed ? -0.7 : 0;
      const tip = closed ? -0.6 : 0;
      f.root.rotation.z = base;
      f.mid.rotation.z = mid;
      f.tip.rotation.z = tip;
      if (index === 0) { // pollice
        f.root.rotation.y = closed ? 0.7 : 0.4;
      }
    }

    function setHandPose(closed) {
      for (let i = 0; i < fingers.length; i++) {
        setFingerPose(i, closed);
      }
    }

    // === SMONTAGGIO (EXPLODE) ===
    const pieces = [
      shoulderShell, shoulderCore,
      upperGroup, upperShell, upperCore,
      elbow, foreGroup, foreShell, foreCore,
      pcb, cable1, cable2,
      wristGroup, palm,
      ...fingers.map(f => f.root)
    ];

    const original = pieces.map(p => ({
      obj: p,
      pos: p.position.clone(),
      quat: p.quaternion.clone()
    }));

    let exploded = false;
    const stateEl = document.getElementById('state');

    function explode() {
      if (exploded) return;
      exploded = true;
      stateEl.textContent = 'Smontato';
      pieces.forEach((p, i) => {
        const start = p.position.clone();
        const dir = new THREE.Vector3(
          (Math.random() - 0.5) * 2,
          Math.random() * 1.5 + 0.3,
          (Math.random() - 0.5) * 2
        ).normalize();
        const dist = 1.0 + Math.random() * 2.5;
        const target = start.clone().add(dir.multiplyScalar(dist));
        let t = 0;
        const steps = Math.round(35 / animSpeed);
        const iv = setInterval(() => {
          t++;
          const a = t / steps;
          p.position.lerpVectors(start, target, a);
          if (t >= steps) clearInterval(iv);
        }, 16);
      });
    }

    function assemble() {
      if (!exploded) return;
      exploded = false;
      stateEl.textContent = 'Assemblato';
      original.forEach((o) => {
        const p = o.obj;
        const start = p.position.clone();
        const target = o.pos.clone();
        const startQ = p.quaternion.clone();
        const targetQ = o.quat.clone();
        let t = 0;
        const steps = Math.round(40 / animSpeed);
        const iv = setInterval(() => {
          t++;
          const a = t / steps;
          p.position.lerpVectors(start, target, a);
          p.quaternion.slerpQuaternions(startQ, targetQ, a);
          if (t >= steps) clearInterval(iv);
        }, 16);
      });
    }

    // === CONTROLLI UI ===
    document.getElementById('openHand').onclick = () => setHandPose(false);
    document.getElementById('closeHand').onclick = () => setHandPose(true);

    const fingerSel = document.getElementById('fingerSel');
    document.getElementById('openFinger').onclick = () => {
      const i = parseInt(fingerSel.value, 10);
      setFingerPose(i, false);
    };
    document.getElementById('closeFinger').onclick = () => {
      const i = parseInt(fingerSel.value, 10);
      setFingerPose(i, true);
    };

    document.getElementById('explode').onclick = explode;
    document.getElementById('assemble').onclick = assemble;

    // === LOOP ===
    setHandPose(false); // dita aperte all'inizio
    resize();

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
