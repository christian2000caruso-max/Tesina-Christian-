<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Tesina di Christian - Protesi Interattiva del Futuro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #050816;
      --bg-alt: #0b1120;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --accent-strong: #0ea5e9;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --card: rgba(15, 23, 42, 0.92);
      --border: rgba(148, 163, 184, 0.3);
      --danger: #f97373;
      --success: #4ade80;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.9);
      --radius-lg: 18px;
      --radius-xl: 26px;
      --blur: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0f172a 0, #020617 42%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Futuristic scrolling */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, var(--accent), var(--accent-strong));
      border-radius: 999px;
    }

    .neon-orbit {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .neon-orbit::before,
    .neon-orbit::after {
      content: "";
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 999px;
      filter: blur(70px);
      opacity: 0.9;
      mix-blend-mode: screen;
    }

    .neon-orbit::before {
      background: radial-gradient(circle, #38bdf8, transparent 60%);
      top: -80px;
      left: -40px;
    }

    .neon-orbit::after {
      background: radial-gradient(circle, #a855f7, transparent 60%);
      bottom: -60px;
      right: -40px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: linear-gradient(
        to bottom,
        rgba(15, 23, 42, 0.94),
        rgba(15, 23, 42, 0.65),
        transparent
      );
      border-bottom: 1px solid var(--border);
    }

    .nav {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-orb {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: conic-gradient(
        from 180deg,
        #38bdf8,
        #a855f7,
        #22c55e,
        #38bdf8
      );
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.9);
      position: relative;
      overflow: hidden;
    }

    .logo-orb::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: inherit;
      background: radial-gradient(circle at 30% 20%, #0f172a 0, #020617 60%);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-weight: 700;
      letter-spacing: 0.03em;
      font-size: 1.05rem;
    }

    .logo-sub {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.25em;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      font-size: 0.9rem;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      position: relative;
      padding: 4px 0;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
      transition: color 0.18s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent), #a855f7);
      transition: width 0.22s ease-out;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .pill {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      padding: 6px 14px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 40%);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.9);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: radial-gradient(circle, #4ade80, #16a34a);
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.9);
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 36px 18px 64px;
    }

    section {
      margin-bottom: 48px;
    }

    /* HERO */

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 32px;
      align-items: center;
    }

    .hero-badge {
      margin-bottom: 16px;
    }

    .hero-title {
      font-size: clamp(2.2rem, 2.7vw + 1.5rem, 2.9rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
    }

    .hero-title span {
      background: linear-gradient(to right, var(--accent), #a855f7);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero-subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 46rem;
      margin-bottom: 18px;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
      font-size: 0.78rem;
    }

    .chip {
      border-radius: 999px;
      padding: 6px 11px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.92);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }

    .chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: radial-gradient(circle, var(--accent), var(--accent-strong));
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.85rem;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.18s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(to right, var(--accent), var(--accent-strong));
      color: #0b1120;
      font-weight: 600;
      box-shadow: 0 16px 30px rgba(56, 189, 248, 0.45);
    }

    .btn-primary:hover {
      filter: brightness(1.04);
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(56, 189, 248, 0.6);
    }

    .btn-ghost {
      border-color: rgba(148, 163, 184, 0.6);
      color: var(--muted);
      background: rgba(15, 23, 42, 0.9);
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--accent);
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), rgba(15, 23, 42, 0.98));
    }

    /* Futuristic hand / prosthesis card */

    .prosthesis-card {
      border-radius: var(--radius-xl);
      padding: 16px;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.26), rgba(15, 23, 42, 0.98));
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(148, 163, 184, 0.45);
      position: relative;
      overflow: hidden;
      min-height: 260px;
    }

    .prosthesis-glow {
      position: absolute;
      inset: -50%;
      background:
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.35), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.35), transparent 55%);
      opacity: 0.75;
      mix-blend-mode: screen;
    }

    .prosthesis-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    .prosthesis-meta {
      font-size: 0.8rem;
      color: rgba(226, 232, 240, 0.86);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .prosthesis-meta span {
      opacity: 0.9;
    }

    .prosthesis-title {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .prosthesis-desc {
      font-size: 0.85rem;
      color: rgba(226, 232, 240, 0.88);
      margin-bottom: 10px;
    }

    .prosthesis-stats {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.78rem;
      color: rgba(226, 232, 240, 0.9);
    }

    .prosthesis-bar {
      height: 7px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    .prosthesis-bar-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(to right, #22c55e, #38bdf8);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.9);
      transition: width 0.8s ease-out;
    }

    .prosthesis-visual {
      position: relative;
      justify-self: center;
    }

    .prosthesis-ring {
      width: 160px;
      height: 160px;
      border-radius: 999px;
      border: 1px dashed rgba(148, 163, 184, 0.6);
      display: grid;
      place-items: center;
      position: relative;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.6));
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.6);
    }

    .prosthesis-core {
      width: 72px;
      height: 96px;
      border-radius: 26px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.5), #020617);
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.9);
    }

    .prosthesis-core::before {
      content: "";
      position: absolute;
      inset: 12px 10px;
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.5), transparent 50%);
      opacity: 0.7;
    }

    .prosthesis-fingers {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 3px;
    }

    .finger {
      width: 8px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(to top, #020617, rgba(148, 163, 184, 0.9));
      box-shadow: inset 0 0 6px rgba(15, 23, 42, 0.7);
      position: relative;
      overflow: hidden;
    }

    .finger::after {
      content: "";
      position: absolute;
      inset: 10px 2px;
      border-radius: 999px;
      background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.6), transparent 75%);
      opacity: 0.9;
    }

    .prosthesis-ring::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: inherit;
      border: 1px solid rgba(56, 189, 248, 0.5);
      opacity: 0.7;
    }

    .prosthesis-ring::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: radial-gradient(circle, #38bdf8, transparent 70%);
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 20px rgba(56, 189, 248, 1);
    }

    .prosthesis-label {
      position: absolute;
      bottom: -26px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: rgba(226, 232, 240, 0.9);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    /* Generic section styling */

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
      max-width: 42rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 18px;
    }

    .card {
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.96);
      padding: 14px 16px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(var(--blur));
    }

    .card-header {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 600;
    }

    .card-tag {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .card-body {
      font-size: 0.88rem;
      color: #e5e7eb;
    }

    .card-body p + p {
      margin-top: 6px;
    }

    .card-list {
      margin-top: 6px;
      font-size: 0.85rem;
    }

    .card-list li {
      margin-left: 16px;
      margin-bottom: 2px;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .subject-pill {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .subject-connection {
      font-size: 0.85rem;
      color: #e5e7eb;
      margin-top: 4px;
    }

    /* Footer */

    footer {
      border-top: 1px solid var(--border);
      padding: 16px 18px 24px;
      margin-top: 8px;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.95), #020617 80%);
    }

    .footer-inner {
      max-width: 1120px;
      margin: 0 auto;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .footer-inner span.highlight {
      color: var(--accent);
    }

    /* RESPONSIVE */

    @media (max-width: 880px) {
      .hero-grid,
      .prosthesis-inner,
      .grid-2 {
        grid-template-columns: minmax(0, 1fr);
      }
      .hero-grid {
        gap: 26px;
      }
      .nav {
        flex-direction: column;
        align-items: flex-start;
      }
      .nav-links {
        flex-wrap: wrap;
      }
      .prosthesis-card {
        margin-top: 8px;
      }
      .prosthesis-label {
        bottom: -20px;
      }
    }

    @media (max-width: 640px) {
      main {
        padding-top: 26
