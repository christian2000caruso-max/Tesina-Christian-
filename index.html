<!DOCTYPE html>
<html lang="it">
<head>
  <!--
    ===============================================
    PROTESI BRACCIO ROBOTICO 3D INTERATTIVA
    Versione "LUNGHISSIMA" con molti commenti
    e struttura pensata per sembrare un progetto
    molto complesso e curato.
    ===============================================
  -->

  <meta charset="utf-8" />
  <title>Braccio Robotico 3D - Versione Estesa</title>

  <!--
    Viewport per dispositivi mobili:
    - Imposta lo zoom iniziale
    - Evita scaling automatico indesiderato
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <!--
    ===============================
    LIBRERIE ESTERNE (CDN)
    ===============================
    Carichiamo:
    - three.min.js            -> motore 3D
    - OrbitControls.js        -> controlli camera con mouse
  -->
  <script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.159.0/examples/js/controls/OrbitControls.js"></script>

  <!--
    ===============================
    STILI GLOBALI DELLA PAGINA
    ===============================
  -->
  <style>
    /* Reset base per avere uno stile consistente */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    /* Body: sfondo scuro tipo interfaccia futuristica */
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      color: #e5e7eb;
    }

    /* Contenitore generale della UI in overlay sopra il canvas 3D */
    #ui {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 10;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-start;
    }

    /* Stile dei pulsanti di controllo */
    button {
      font-size: 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      padding: 6px 10px;
      background: #020617;
      color: #e5e7eb;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease,
        box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.7);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    /* Pulsante principale (es. Apri mano) colorato */
    button.primary {
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      border: none;
      color: #020617;
      font-weight: 600;
    }

    /* Pulsante per azione "pericolosa" (Smonta) */
    button.danger {
      background: linear-gradient(90deg, #fb7185, #f97316);
      border: none;
      color: #020617;
      font-weight: 600;
    }

    /* Box che mostra lo stato attuale (Assemblato / Smontato) */
    #stateBox {
      position: fixed;
      left: 10px;
      bottom: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.5);
      font-size: 12px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Piccolo pallino luminoso di stato */
    #stateDot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: radial-gradient(circle, #22c55e, #16a34a);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
    }

    /* Canvas 3D: occupa tutta la finestra */
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Piccolo messaggio in alto a destra con le istruzioni */
    #hintBox {
      position: fixed;
      right: 10px;
      top: 10px;
      z-index: 10;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.5);
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <!--
    ===============================
    UI OVERLAY (sopra la scena 3D)
    ===============================
  -->
  <div id="ui">
    <!-- Pulsante per aprire tutte le dita -->
    <button id="openHand" class="primary">
      Apri mano
    </button>

    <!-- Pulsante per chiudere tutte le dita -->
    <button id="closeHand">
      Chiudi mano
    </button>

    <!-- Pulsante per smontare/rimontare la protesi -->
    <button id="explode" class="danger">
      Smonta / Rimonta
    </button>
  </div>

  <!-- Box di stato in basso a sinistra -->
  <div id="stateBox">
    <div id="stateDot"></div>
    Stato:
    <span id="state">Assemblato</span>
  </div>

  <!-- Piccole istruzioni in alto a destra -->
  <div id="hintBox">
    Trascina per ruotare &bull; Rotellina per zoom &bull; Braccio ENORME
  </div>

  <!-- Canvas dove Three.js disegna la scena 3D -->
  <canvas id="c"></canvas>

  <!--
    ============================================================
    SCRIPT JAVASCRIPT PRINCIPALE
    - Gestisce: scena 3D, camera, luci, geometrie del braccio,
      animazione delle dita, smontaggio e rimontaggio.
    ============================================================
  -->
  <script>
    // =========================================================
    // 1. IMPOSTAZIONE DI BASE DEL RENDERER, SCENA E CAMERA
    // =========================================================

    // Recupero il canvas dall'HTML
    const canvas = document.getElementById("c");

    // Creo il renderer WebGL con antialias per bordi più lisci
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
    });

    // Imposto la risoluzione in base al devicePixelRatio
    renderer.setPixelRatio(window.devicePixelRatio || 1);

    // Creo una nuova scena 3D
    const scene = new THREE.Scene();

    // Imposto il colore di sfondo della scena
    scene.background = new THREE.Color(0x020617);

    // Creo la camera prospettica
    const camera = new THREE.PerspectiveCamera(
      40, // campo visivo in gradi
      2,  // aspect ratio (verrà aggiornato in resize)
      0.1, // near plane
      200  // far plane
    );

    // Posiziono la camera in modo da vedere bene il braccio enorme
    camera.position.set(10, 3, 6);

    // =========================================================
    // 2. CONTROLLI ORBITALI (OrbitControls)
    //    - Permettono di ruotare/zoommare la scena con il mouse
    // =========================================================

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Punto verso cui la camera "guarda"
    controls.target.set(3, 1.2, 0);

    // Abilito uno smorzamento fluido del movimento della camera
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // Limito la distanza minima e massima della camera
    controls.minDistance = 3;
    controls.maxDistance = 40;

    // =========================================================
    // 3. FUNZIONE DI RIDIMENSIONAMENTO
    //    - Mantiene il canvas a pieno schermo
    // =========================================================

    function resizeRendererToDisplaySize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      // Imposto le dimensioni effettive del renderer
      renderer.setSize(width, height, false);

      // Aggiorno il rapporto d'aspetto della camera
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    // Ascolto l'evento di resize della finestra
    window.addEventListener("resize", resizeRendererToDisplaySize);

    // Eseguo almeno una volta il resize iniziale
    resizeRendererToDisplaySize();

    // =========================================================
    // 4. LUCI DELLA SCENA
    //    - AmbientLight per luce diffusa
    //    - DirectionalLight per luce direzionale principale
    //    - Altra DirectionalLight per "rim light"
    // =========================================================

    // Luce ambientale (illumina tutto in modo leggero)
    const ambientLight = new THREE.AmbientLight(0x9fbcd9, 0.5);
    scene.add(ambientLight);

    // Luce direzionale principale (simula una luce dall'alto)
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(8, 10, 5);
    scene.add(keyLight);

    // Luce direzionale di "contorno" con colore freddo
    const rimLight = new THREE.DirectionalLight(0x60a5fa, 0.9);
    rimLight.position.set(-8, 6, -4);
    scene.add(rimLight);

    // =========================================================
    // 5. PAVIMENTO / BASE
    //    - Solo per dare un riferimento visivo sotto il braccio
    // =========================================================

    const floorGeometry = new THREE.CircleGeometry(30, 64);
    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x020617,
      metalness: 0.8,
      roughness: 0.5,
    });

    const floorMesh = new THREE.Mesh(floorGeometry, floorMaterial);
    floorMesh.rotation.x = -Math.PI / 2; // ruoto per metterlo orizzontale
    floorMesh.position.y = -1;
    scene.add(floorMesh);

    // =========================================================
    // 6. MATERIALI PER IL BRACCIO
    // =========================================================

    // Materiale del guscio esterno (bianco lucido)
    const matShell = new THREE.MeshPhysicalMaterial({
      color: 0xf3f4f6,
      metalness: 0.6,
      roughness: 0.12,
      clearcoat: 0.8,
      clearcoatRoughness: 0.04,
    });

    // Materiale metallico lucido (tipo acciaio/cromo)
    const matMetal = new THREE.MeshStandardMaterial({
      color: 0xc0cad2,
      metalness: 1,
      roughness: 0.04,
    });

    // Materiale scuro per giunti e parti interne
    const matDark = new THREE.MeshStandardMaterial({
      color: 0x111827,
      metalness: 0.9,
      roughness: 0.25,
    });

    // Materiale verde stile "scheda elettronica" (PCB)
    const matPCB = new THREE.MeshStandardMaterial({
      color: 0x14532d,
      metalness: 0.3,
      roughness: 0.4,
      emissive: 0x16a34a,
      emissiveIntensity: 0.3,
    });

    // Materiale per cavi neri
    const matCable = new THREE.MeshStandardMaterial({
      color: 0x020617,
      metalness: 0.2,
      roughness: 0.7,
    });

    // =========================================================
    // 7. COSTRUZIONE DEL BRACCIO ROBOTICO
    //    - armRoot: gruppo principale
    //    - spalla, braccio sup, gomito, avambraccio, polso, mano
    // =========================================================

    // Gruppo principale che contiene tutto il braccio
    const armRoot = new THREE.Group();
    scene.add(armRoot);

    // Posizioniamo il braccio e lo scaliamo ENORME
    armRoot.position.set(0, 0.5, 0);
    armRoot.scale.set(5, 5, 5); // scala gigante

    // ---------------------------------------------------------
    // 7.1 Spalla (Shoulder)
    // ---------------------------------------------------------

    const shoulderShell = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.8, 0.6, 16, 32),
      matShell
    );
    shoulderShell.rotation.z = Math.PI / 2; // ruoto la capsula
    shoulderShell.position.set(-2.2, 0.4, 0);
    armRoot.add(shoulderShell);

    const shoulderCore = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.6, 0.2, 16, 32),
      matMetal
    );
    shoulderCore.rotation.z = Math.PI / 2;
    shoulderCore.position.set(-1.7, 0.4, 0);
    armRoot.add(shoulderCore);

    // ---------------------------------------------------------
    // 7.2 Braccio superiore (Upper Arm)
    // ---------------------------------------------------------

    const upperGroup = new THREE.Group();
    upperGroup.position.set(-0.9, 0.4, 0);
    armRoot.add(upperGroup);

    const upperShell = new THREE.Mesh(
      new THREE.CylinderGeometry(0.6, 0.8, 2.4, 32, 1, true),
      matShell
    );
    upperShell.rotation.z = Math.PI / 2;
    upperShell.position.set(1.2, 0, 0);
    upperGroup.add(upperShell);

    const upperCore = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.3, 2.2, 32),
      matMetal
    );
    upperCore.rotation.z = Math.PI / 2;
    upperCore.position.set(1.2, 0, 0);
    upperGroup.add(upperCore);

    // ---------------------------------------------------------
    // 7.3 Gomito (Elbow)
    // ---------------------------------------------------------

    const elbow = new THREE.Mesh(
      new THREE.SphereGeometry(0.55, 32, 32),
      matDark
    );
    elbow.position.set(1.8, 0.4, 0);
    armRoot.add(elbow);

    // ---------------------------------------------------------
    // 7.4 Avambraccio (Forearm)
    // ---------------------------------------------------------

    const foreGroup = new THREE.Group();
    foreGroup.position.set(1.8, 0.4, 0);
    armRoot.add(foreGroup);

    const foreShell = new THREE.Mesh(
      new THREE.CylinderGeometry(0.55, 0.7, 2.2, 32, 1, true),
      matShell
    );
    foreShell.rotation.z = Math.PI / 2;
    foreShell.position.set(1.3, 0, 0);
    foreGroup.add(foreShell);

    const foreCore = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.28, 2.0, 32),
      matMetal
    );
    foreCore.rotation.z = Math.PI / 2;
    foreCore.position.set(1.3, 0, 0);
    foreGroup.add(foreCore);

    // PCB (scheda elettronica) laterale sull'avambraccio
    const pcb = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.7, 0.9),
      matPCB
    );
    pcb.position.set(0.8, 0.2, -0.4);
    pcb.rotation.y = 0.5;
    foreGroup.add(pcb);

    // Cavi neri (data + power)
    const cable1 = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.06, 1.4, 16),
      matCable
    );
    cable1.rotation.z = Math.PI / 2;
    cable1.position.set(0.7, -0.1, 0.45);
    foreGroup.add(cable1);

    const cable2 = cable1.clone();
    cable2.position.set(1.5, -0.1, -0.45);
    foreGroup.add(cable2);

    // ---------------------------------------------------------
    // 7.5 Polso (Wrist)
    // ---------------------------------------------------------

    const wristGroup = new THREE.Group();
    wristGroup.position.set(3.2, 0.4, 0);
    armRoot.add(wristGroup);

    const wrist = new THREE.Mesh(
      new THREE.CylinderGeometry(0.45, 0.5, 0.6, 32),
      matDark
    );
    wrist.rotation.z = Math.PI / 2;
    wristGroup.add(wrist);

    const wristRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.5, 0.08, 16, 64),
      matMetal
    );
    wristRing.rotation.x = Math.PI / 2;
    wristGroup.add(wristRing);

    // ---------------------------------------------------------
    // 7.6 Mano (Hand) + Palme + Dita
    // ---------------------------------------------------------

    const handGroup = new THREE.Group();
    handGroup.position.set(3.6, 0.4, 0);
    armRoot.add(handGroup);

    // Palmo
    const palm = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 0.35, 1.3),
      matShell
    );
    handGroup.add(palm);

    // Dita: 5 dita, ognuna con 3 falangi
    const fingers = [];
    const fingerOffsetsZ = [-0.6, -0.3, 0, 0.3, 0.6];

    for (let i = 0; i < 5; i++) {
      const root = new THREE.Group();
      root.position.set(0.55, 0, fingerOffsetsZ[i]);
      handGroup.add(root);

      const seg1 = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.18, 0.18),
        matMetal
      );
      seg1.position.set(0.2, 0, 0);
      root.add(seg1);

      const mid = new THREE.Group();
      mid.position.set(0.4, 0, 0);
      root.add(mid);

      const seg2 = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.16, 0.16),
        matMetal
      );
      seg2.position.set(0.175, 0, 0);
      mid.add(seg2);

      const tip = new THREE.Group();
      tip.position.set(0.35, 0, 0);
      mid.add(tip);

      const seg3 = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.14, 0.14),
        matMetal
      );
      seg3.position.set(0.15, 0, 0);
      tip.add(seg3);

      fingers.push({ root, mid, tip });
    }

    // Pollice leggermente inclinato e spostato
    fingers[0].root.rotation.y = 0.4;
    fingers[0].root.position.z = -0.4;

    // =========================================================
    // 8. FUNZIONI DI ANIMAZIONE DELLE DITA / MANO
    // =========================================================

    // Velocità fittizia (se vuoi puoi usarla per animazioni più complesse)
    let animSpeed = 1;

    /**
     * Imposta la posa di un singolo dito.
     * @param {number} index - indice del dito (0 = pollice, 1 = indice, ecc.)
     * @param {boolean} closed - true per chiuso, false per aperto
     */
    function setFingerPose(index, closed) {
      const f = fingers[index];
      if (!f) return;

      const baseAngle = closed ? -1.0 : 0;
      const midAngle = closed ? -0.7 : 0;
      const tipAngle = closed ? -0.6 : 0;

      f.root.rotation.z = baseAngle;
      f.mid.rotation.z = midAngle;
      f.tip.rotation.z = tipAngle;

      if (index === 0) {
        // Pollice: ruotiamo anche sull'asse Y
